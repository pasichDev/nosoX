name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: verify modules
        run: go mod verify
      - name: go vet
        run: go vet -p 2 ./...
      - name: build
        run: go build -p 2 ./...
      - name: race tests
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          go test -race -p 2 ./... -count=1 2>&1 | tee .ci-logs/race.log
      - name: coverage tests
        shell: bash
        run: |
          mkdir -p .ci-logs
          set -o pipefail
          go test -p 2 -coverprofile=coverage.out ./... -count=1 2>&1 | tee .ci-logs/coverage.log
      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1
      - name: upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            .ci-logs/
            coverage.out
          if-no-files-found: warn
          retention-days: 7
