version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
  settings:
    errcheck:
      # Deferred and best-effort cleanup calls whose errors carry no action.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
        - os.Remove
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - staticcheck
